name: Check plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: python -m pip install -r requirements.txt
      - run: python tools/lint.py --wiki-dir wiki/
